<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الفنانه كنزي — مقولات</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-black:#0f0a0c;
    --bg-panel:#1a1216;
    --bg-panel-2:#211519;
    --panel-border:#33202a;
    --burgundy:#5c1a2e;
    --burgundy-light:#7c2c44;
    --red-dark:#8c1f2c;
    --red-glow:#b8334a;
    --grey-mid:#7d7377;
    --grey-light:#dcd3d6;
    --grey-faint:#4c4249;
    --ink:#c9c0c3;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:
      radial-gradient(ellipse 120% 80% at 50% -10%, rgba(92,26,46,0.35), transparent 60%),
      radial-gradient(ellipse 100% 60% at 50% 110%, rgba(140,31,44,0.18), transparent 60%),
      var(--bg-black);
    color:var(--grey-light);
    font-family:'Tajawal', sans-serif;
    overflow-x:hidden;
  }

  .stage{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:48px 20px 60px;
  }

  /* ---------- header / candle ---------- */
  .brand{
    text-align:center;
    margin-bottom:6px;
  }

  .candle-wrap{
    width:64px;
    height:90px;
    margin:0 auto 10px;
    position:relative;
  }

  .flame{
    position:absolute;
    top:0; left:50%;
    width:14px; height:22px;
    transform:translateX(-50%);
    background:radial-gradient(circle at 50% 65%, #ffd9a8 0%, var(--red-glow) 45%, var(--burgundy) 80%, transparent 90%);
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    filter:blur(0.3px);
    animation:flicker 2.6s ease-in-out infinite;
    transform-origin:50% 90%;
  }
  .flame::after{
    content:'';
    position:absolute;
    inset:0;
    margin:auto;
    width:60%;
    height:70%;
    background:radial-gradient(circle at 50% 70%, #fff3d6 0%, #ffcf8a 60%, transparent 80%);
    border-radius:50%;
    opacity:0.85;
  }
  .glow{
    position:absolute;
    top:-14px; left:50%;
    width:90px; height:90px;
    transform:translateX(-50%);
    background:radial-gradient(circle, rgba(184,51,74,0.28) 0%, transparent 70%);
    pointer-events:none;
    animation:glow-pulse 2.6s ease-in-out infinite;
  }
  .wick{
    position:absolute;
    top:20px; left:50%;
    width:2px; height:6px;
    transform:translateX(-50%);
    background:#2a1c1c;
  }
  .candle-body{
    position:absolute;
    top:24px; left:50%;
    width:22px; height:60px;
    transform:translateX(-50%);
    background:linear-gradient(180deg, #d8cfc9 0%, #b9aca6 100%);
    border-radius:3px 3px 2px 2px;
    box-shadow:inset -4px 0 6px rgba(0,0,0,0.25), inset 3px 0 4px rgba(255,255,255,0.15);
  }
  .drip{
    position:absolute;
    top:24px; left:calc(50% + 6px);
    width:5px; height:16px;
    background:#c7bab4;
    border-radius:0 0 4px 4px;
  }
  .candle-plate{
    position:absolute;
    bottom:0; left:50%;
    width:46px; height:6px;
    transform:translateX(-50%);
    background:linear-gradient(180deg, var(--burgundy-light), var(--burgundy));
    border-radius:50%;
    box-shadow:0 3px 10px rgba(0,0,0,0.5);
  }

  @keyframes flicker{
    0%,100%{ transform:translateX(-50%) scaleY(1) rotate(0deg); opacity:1;}
    25%{ transform:translateX(-52%) scaleY(1.05) rotate(-2deg); opacity:0.92;}
    50%{ transform:translateX(-48%) scaleY(0.96) rotate(1.5deg); opacity:1;}
    75%{ transform:translateX(-51%) scaleY(1.02) rotate(-1deg); opacity:0.95;}
  }
  @keyframes glow-pulse{
    0%,100%{ opacity:0.7; }
    50%{ opacity:1; }
  }

  .site-title{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size:2.1rem;
    letter-spacing:0.5px;
    color:var(--grey-light);
    margin:0;
    text-shadow:0 0 18px rgba(184,51,74,0.25);
  }
  .site-subtitle{
    font-family:'Tajawal', sans-serif;
    font-weight:300;
    font-size:0.85rem;
    letter-spacing:4px;
    color:var(--grey-mid);
    margin:6px 0 0;
  }

  /* ---------- icon row (notifications / username) ---------- */
  .icon-row{
    display:flex;
    gap:14px;
    justify-content:center;
    margin-top:16px;
  }
  .icon-btn{
    position:relative;
    width:38px; height:38px;
    border-radius:50%;
    background:var(--bg-panel);
    border:1px solid var(--panel-border);
    color:var(--grey-mid);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:all .22s ease;
  }
  .icon-btn:hover{ color:var(--red-glow); border-color:var(--red-dark); }
  .icon-btn.active{ color:#fff; border-color:var(--burgundy-light); background:var(--bg-panel-2); }
  .icon-btn svg{ width:17px; height:17px; }
  .badge{
    position:absolute;
    top:-4px; left:-4px;
    min-width:16px; height:16px;
    padding:0 3px;
    border-radius:8px;
    background:var(--red-dark);
    color:#fff;
    font-size:0.62rem;
    font-family:'Tajawal', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:1;
  }

  .panel{
    width:100%;
    max-width:360px;
    margin:0 auto;
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition:max-height .4s ease, opacity .3s ease, margin-top .3s ease;
  }
  .panel.open{
    max-height:320px;
    opacity:1;
    margin-top:14px;
    overflow-y:auto;
  }
  .panel-inner{
    background:var(--bg-panel);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:16px 18px;
    text-align:right;
  }
  .panel-header{
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    font-size:0.88rem;
    color:var(--grey-light);
    margin-bottom:10px;
  }
  .panel-header-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:4px;
  }
  .panel-header-row .panel-header{ margin-bottom:0; }
  .panel-clear-btn{
    background:none;
    border:1px solid var(--panel-border);
    color:var(--grey-mid);
    font-family:'Tajawal', sans-serif;
    font-size:0.7rem;
    padding:4px 12px;
    border-radius:14px;
    cursor:pointer;
    transition:all .2s ease;
  }
  .panel-clear-btn:hover{ border-color:var(--red-dark); color:var(--red-glow); }
  .panel-empty{
    font-family:'Tajawal', sans-serif;
    font-size:0.8rem;
    color:var(--grey-faint);
    text-align:center;
    margin:10px 0;
  }
  .notif-item{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid var(--panel-border);
    font-family:'Tajawal', sans-serif;
    font-size:0.82rem;
    color:var(--grey-light);
    line-height:1.7;
  }
  .notif-item:last-child{ border-bottom:none; }
  .notif-close{
    flex-shrink:0;
    background:none;
    border:none;
    color:var(--grey-faint);
    cursor:pointer;
    font-size:0.95rem;
    line-height:1;
    padding:2px 4px;
    transition:color .2s;
  }
  .notif-close:hover{ color:var(--red-glow); }

  .viewer-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid var(--panel-border);
    font-family:'Tajawal', sans-serif;
    font-size:0.82rem;
    color:var(--grey-light);
  }
  .viewer-item:last-child{ border-bottom:none; }
  .viewer-item.blocked{ color:var(--grey-faint); }
  .viewer-toggle{
    flex-shrink:0;
    background:none;
    border:1px solid var(--panel-border);
    color:var(--grey-mid);
    font-family:'Tajawal', sans-serif;
    font-size:0.72rem;
    padding:4px 12px;
    border-radius:14px;
    cursor:pointer;
    transition:all .2s ease;
  }
  .viewer-toggle:hover{ border-color:var(--red-dark); color:var(--red-glow); }
  .viewer-toggle.is-blocked{
    border-color:var(--burgundy-light);
    color:var(--red-glow);
  }

  .username-input{
    width:100%;
    background:var(--bg-panel-2);
    border:1px solid var(--panel-border);
    border-radius:20px;
    color:var(--grey-light);
    font-family:'Tajawal', sans-serif;
    font-size:0.9rem;
    padding:10px 16px;
    outline:none;
    text-align:center;
    transition:border-color .25s;
    margin-bottom:12px;
  }
  .username-input:focus{ border-color:var(--burgundy-light); }
  .username-hint{
    font-family:'Tajawal', sans-serif;
    font-size:0.72rem;
    color:var(--grey-faint);
    text-align:center;
    margin:10px 0 0;
    line-height:1.7;
  }
  .panel-save-btn{ width:100%; }

  /* ---------- code bar ---------- */
  .code-bar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:16px;
    font-size:0.82rem;
    color:var(--grey-mid);
  }
  .code-value{
    color:var(--red-glow);
    font-weight:700;
    letter-spacing:2px;
    background:rgba(140,31,44,0.12);
    border:1px solid var(--panel-border);
    padding:3px 12px;
    border-radius:14px;
    font-family:'Tajawal', sans-serif;
  }
  .copy-btn{
    background:none;
    border:none;
    color:var(--grey-mid);
    cursor:pointer;
    padding:4px;
    display:flex;
    align-items:center;
    transition:color .2s;
  }
  .copy-btn:hover{ color:var(--red-glow); }
  .copy-btn svg{ width:15px; height:15px; }

  .mode-notice{
    max-width:460px;
    margin:12px auto 0;
    text-align:center;
    font-size:0.72rem;
    line-height:1.8;
    color:var(--grey-faint);
    padding:9px 16px;
    border:1px dashed var(--panel-border);
    border-radius:8px;
  }

  /* ---------- tabs ---------- */
  .tabs-bar{
    width:100%;
    max-width:640px;
    margin-top:36px;
  }
  .tabs-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .tab-item{
    display:flex;
    align-items:center;
    gap:4px;
    flex-shrink:0;
    background:transparent;
    border:1px solid var(--panel-border);
    border-bottom:none;
    color:var(--grey-mid);
    font-family:'Tajawal', sans-serif;
    font-size:0.82rem;
    padding:11px 8px 11px 20px;
    border-radius:14px 14px 0 0;
    cursor:pointer;
    transition:all .22s ease;
    white-space:nowrap;
  }
  .tab-item.active{
    color:#fff;
    background:var(--bg-panel);
    border-color:var(--panel-border);
  }
  .tab-item:hover{ color:var(--grey-light); }
  .tab-label{ max-width:140px; overflow:hidden; text-overflow:ellipsis; }
  .tab-alias{
    background:none;
    border:none;
    color:var(--grey-faint);
    cursor:pointer;
    font-size:0.8rem;
    line-height:1;
    padding:8px;
    margin:-8px 0;
    display:flex;
    align-items:center;
    transition:color .2s;
  }
  .tab-alias:hover{ color:var(--red-glow); }
  .tab-alias svg{ width:13px; height:13px; }
  .tab-close{
    background:none;
    border:none;
    color:var(--grey-faint);
    cursor:pointer;
    font-size:1rem;
    line-height:1;
    padding:8px;
    margin:-8px 0;
    transition:color .2s;
  }
  .tab-close:hover{ color:var(--red-glow); }
  .tab-add-btn{
    flex-shrink:0;
    width:34px; height:34px;
    border-radius:50%;
    background:transparent;
    border:1px dashed var(--grey-faint);
    color:var(--grey-mid);
    cursor:pointer;
    font-size:1.1rem;
    line-height:1;
    align-self:center;
    transition:all .22s ease;
  }
  .tab-add-btn:hover{
    border-color:var(--red-dark);
    color:var(--red-glow);
  }

  .code-entry{
    display:flex;
    gap:8px;
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition:max-height .35s ease, opacity .3s ease, margin-top .3s ease;
    margin-top:0;
  }
  .code-entry.open{
    max-height:70px;
    opacity:1;
    margin-top:12px;
  }
  .code-entry-input{
    flex:1;
    background:var(--bg-panel);
    border:1px solid var(--panel-border);
    border-radius:20px;
    color:var(--grey-light);
    font-family:'Tajawal', sans-serif;
    font-size:0.85rem;
    padding:9px 16px;
    outline:none;
    letter-spacing:2px;
    text-align:center;
    transition:border-color .25s;
  }
  .code-entry-input:focus{ border-color:var(--burgundy-light); }
  .code-entry-btn, .code-entry-cancel{
    font-family:'Tajawal', sans-serif;
    font-size:0.8rem;
    padding:9px 18px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
  }
  .code-entry-btn{
    background:linear-gradient(135deg, var(--red-dark), var(--burgundy));
    color:#f2e8ea;
    border:none;
  }
  .code-entry-cancel{
    background:transparent;
    border:1px solid var(--panel-border);
    color:var(--grey-mid);
  }
  .code-entry-cancel:hover{ color:var(--grey-light); }

  /* ---------- quote stage ---------- */
  .quote-frame{
    position:relative;
    width:100%;
    max-width:640px;
    margin-top:0;
    padding:50px 40px 46px;
    background:linear-gradient(180deg, var(--bg-panel) 0%, var(--bg-panel-2) 100%);
    border:1px solid var(--panel-border);
    border-radius:0 6px 6px 6px;
    box-shadow:0 20px 50px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.03);
    min-height:260px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
  }

  .quote-frame::before,
  .quote-frame::after{
    position:absolute;
    font-family:'Aref Ruqaa', serif;
    font-size:5.5rem;
    color:var(--burgundy);
    opacity:0.35;
    line-height:1;
    pointer-events:none;
    user-select:none;
  }
  .quote-frame::before{
    content:'”';
    top:6px; right:22px;
  }
  .quote-frame::after{
    content:'“';
    bottom:-4px; left:22px;
    opacity:0.22;
  }

  .quote-text{
    font-family:'Amiri', serif;
    font-size:clamp(1.35rem, 3vw, 1.85rem);
    line-height:2;
    color:var(--ink);
    max-width:520px;
    transition:opacity .5s ease, filter .5s ease, transform .5s ease;
  }

  .quote-text.dissolve{
    opacity:0;
    filter:blur(6px);
    transform:translateY(6px);
  }

  .quote-index{
    margin-top:28px;
    font-size:0.8rem;
    color:var(--grey-mid);
    letter-spacing:1px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    font-family:'Tajawal', sans-serif;
  }

  .quote-index-input{
    width:2.6em;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--grey-faint);
    color:var(--grey-light);
    font-family:'Tajawal', sans-serif;
    font-size:0.85rem;
    text-align:center;
    letter-spacing:1px;
    padding:1px 2px;
    outline:none;
    transition:border-color .25s, color .25s;
    -moz-appearance:textfield;
    appearance:textfield;
  }
  .quote-index-input:hover{
    color:var(--grey-light);
    border-color:var(--grey-mid);
  }
  .quote-index-input:focus{
    border-color:var(--red-glow);
    color:#fff;
  }

  .quote-actions{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-top:14px;
  }

  .quote-copy{
    display:flex;
    align-items:center;
    gap:6px;
    background:none;
    border:1px solid var(--grey-faint);
    color:var(--grey-mid);
    font-family:'Tajawal', sans-serif;
    font-size:0.75rem;
    padding:5px 14px;
    border-radius:20px;
    cursor:pointer;
    transition:border-color .25s, color .25s;
  }
  .quote-copy svg{ width:12px; height:12px; }
  .quote-copy:hover{
    border-color:var(--burgundy-light);
    color:var(--grey-light);
  }

  .quote-delete{
    margin-top:0;
    background:none;
    border:1px solid var(--grey-faint);
    color:var(--grey-mid);
    font-family:'Tajawal', sans-serif;
    font-size:0.75rem;
    padding:5px 14px;
    border-radius:20px;
    cursor:pointer;
    transition:border-color .25s, color .25s;
  }
  .quote-delete:hover{
    border-color:var(--red-dark);
    color:var(--red-glow);
  }

  /* ---------- nav controls ---------- */
  .nav-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    margin-top:26px;
    width:100%;
    max-width:640px;
  }

  .nav-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background:transparent;
    border:1px solid var(--panel-border);
    color:var(--grey-light);
    font-family:'Tajawal', sans-serif;
    font-size:0.9rem;
    font-weight:500;
    padding:10px 20px;
    border-radius:30px;
    cursor:pointer;
    transition:all .25s ease;
  }
  .nav-btn:hover{
    border-color:var(--red-dark);
    background:rgba(140,31,44,0.12);
    color:#fff;
    box-shadow:0 0 16px rgba(184,51,74,0.18);
  }
  .nav-btn svg{ width:14px; height:14px; flex-shrink:0; }

  .dots{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    justify-content:center;
    max-width:120px;
  }
  .dot{
    width:6px; height:6px;
    border-radius:50%;
    background:var(--grey-faint);
    transition:background .3s, transform .3s;
    cursor:pointer;
  }
  .dot.active{
    background:var(--red-glow);
    transform:scale(1.5);
  }

  /* ---------- add quote ---------- */
  .add-section{
    width:100%;
    max-width:640px;
    margin-top:52px;
  }

  .add-toggle{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    background:none;
    border:none;
    border-top:1px solid var(--panel-border);
    padding-top:22px;
    color:var(--grey-mid);
    font-family:'Tajawal', sans-serif;
    font-size:0.9rem;
    cursor:pointer;
    letter-spacing:0.5px;
    transition:color .25s;
  }
  .add-toggle:hover{ color:var(--grey-light); }
  .add-toggle .plus{
    display:inline-block;
    transition:transform .3s ease;
    color:var(--red-glow);
    font-size:1.1rem;
  }
  .add-toggle.open .plus{ transform:rotate(45deg); }

  .add-form{
    max-height:0;
    overflow:hidden;
    transition:max-height .45s ease, opacity .35s ease, margin-top .35s ease;
    opacity:0;
    margin-top:0;
  }
  .add-form.open{
    max-height:320px;
    opacity:1;
    margin-top:20px;
  }

  .add-form textarea{
    width:100%;
    min-height:96px;
    background:var(--bg-panel);
    border:1px solid var(--panel-border);
    border-radius:6px;
    color:var(--grey-light);
    font-family:'Amiri', serif;
    font-size:1.05rem;
    line-height:1.9;
    padding:16px;
    resize:vertical;
    outline:none;
    transition:border-color .25s;
  }
  .add-form textarea:focus{
    border-color:var(--burgundy-light);
  }
  .add-form textarea::placeholder{
    color:var(--grey-faint);
    font-family:'Tajawal', sans-serif;
    font-size:0.9rem;
  }

  .add-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:12px;
  }

  .btn-primary{
    background:linear-gradient(135deg, var(--red-dark), var(--burgundy));
    color:#f2e8ea;
    border:none;
    font-family:'Tajawal', sans-serif;
    font-weight:500;
    font-size:0.9rem;
    padding:10px 26px;
    border-radius:26px;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(140,31,44,0.35);
    transition:transform .2s ease, box-shadow .2s ease;
  }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  const DEFAULT_QUOTES = [
    "أشدُّ ما يؤلم في الغياب، أن يترك المرء خلفه حضورًا لا يغادر الذاكرة.",
    "كنتُ أظن أن الحزن عابر، حتى صار جزءًا من ملامح أيامي.",

    "ثمة أشخاص لا يرحلون حين يغادرون، بل يبقون فينا على هيئة وجع.",
    "أرهقني انتظار شيءٍ أدركتُ متأخرًا أنه لم يكن ليأتي.",
    "أقسى أنواع الوحدة أن تكون محاطًا بالجميع، ولا تجد قلبًا يشبه مأواك.",
    "لم يؤلمني رحيلك بقدر ما آلمني أنني كنتُ أراك وطنًا، بينما كنتَ تراني عابرًا.",
    "تغيّر كل شيء حين أصبح ما كان يسعدني يذكّرني بما فقدت.",
    "أحيانًا لا نحتاج إلى من ينقذنا، بل إلى من يفهم لماذا غرقنا.",
    "صار قلبي يتقن الصمت، بعدما عجز الكلام عن شرح ما يحدث داخله.",
    "ما بيني وبين الحزن ليس علاقة عابرة؛ إنه طريقٌ طال بي حتى نسيتُ أين كانت بدايته.",
    "أفتقد نسخةً مني كانت تعرف كيف تفرح دون أن تخشى أن ينتهي الفرح.",
    "ربما لم يكن الفراق هو المؤلم، بل اكتشاف أنني كنتُ أعيش على أملٍ لم يكن متبادلًا.",
    "هناك وجعٌ لا يُرى، لكنه يغيّر الإنسان من الداخل حتى لا يعود كما كان.",
    "كنتُ أبحث عن سببٍ لانطفائي، ثم أدركت أنني أمضيت طويلًا أضيء لأجل شخصٍ لم يرَ النور أصلًا."
  ];

  // =========================================================
  // ⚠️ خطوة الربط بقاعدة البيانات:
  // بعد ما تجهّزي مشروعك على Supabase (شوفي الدليل)، هتلاقي فيه
  // Project URL و anon public key من Project Settings → API.
  // حطيهم بدل القيمتين دول بالظبط، بعدين ارفعي الملف تاني.
  // =========================================================
  const SUPABASE_URL = 'https://yvjfsawvcnantoabtuqi.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_vsmtzGWCbNeTyTGfTMeY9Q__KiHIQoh';

  const isSupabaseConfigured = !SUPABASE_URL.startsWith('YOUR_') && !SUPABASE_ANON_KEY.startsWith('YOUR_');
  let sb = null;
  if(isSupabaseConfigured && window.supabase && window.supabase.createClient){
    try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }catch(e){ sb = null; }
  }

  // ---- state ----
  let tabs = [];          // [{code, collectionId, label, quotes:[{id,text}], editable}]
  let activeTabIndex = 0;
  let currentIndex = 0;
  let myUsername = null;
  let myUsernameUpdatedAt = null;

  // ---- DOM refs ----
  const quoteText = document.getElementById('quoteText');
  const quoteIndexInput = document.getElementById('quoteIndexInput');
  const quoteTotal = document.getElementById('quoteTotal');
  const dotsEl = document.getElementById('dots');
  const deleteBtn = document.getElementById('deleteBtn');
  const nextBtn = document.getElementById('nextBtn');
  const prevBtn = document.getElementById('prevBtn');
  const addSection = document.getElementById('addSection');
  const addToggle = document.getElementById('addToggle');
  const addForm = document.getElementById('addForm');
  const quoteInput = document.getElementById('quoteInput');
  const submitBtn = document.getElementById('submitBtn');
  const toast = document.getElementById('toast');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalConfirm = document.getElementById('modalConfirm');
  const modalCancel = document.getElementById('modalCancel');
  const codeValueEl = document.getElementById('codeValue');
  const copyCodeBtn = document.getElementById('copyCodeBtn');
  const modeNotice = document.getElementById('modeNotice');
  const tabsRow = document.getElementById('tabsRow');
  const tabAddBtn = document.getElementById('tabAddBtn');
  const codeEntryForm = document.getElementById('codeEntryForm');
  const codeEntryInput = document.getElementById('codeEntryInput');
  const codeEntrySubmit = document.getElementById('codeEntrySubmit');
  const codeEntryCancel = document.getElementById('codeEntryCancel');
  const modalMessageEl = document.getElementById('modalMessage');
  const notifBtn = document.getElementById('notifBtn');
  const notifBadge = document.getElementById('notifBadge');
  const notifPanel = document.getElementById('notifPanel');
  const notifList = document.getElementById('notifList');
  const notifClearAllBtn = document.getElementById('notifClearAllBtn');
  const viewersBtn = document.getElementById('viewersBtn');
  const viewersPanel = document.getElementById('viewersPanel');
  const viewersList = document.getElementById('viewersList');
  const usernameBtn = document.getElementById('usernameBtn');
  const usernamePanel = document.getElementById('usernamePanel');
  const usernameInput = document.getElementById('usernameInput');
  const usernameSaveBtn = document.getElementById('usernameSaveBtn');
  const usernameHint = document.getElementById('usernameHint');
  const copyQuoteBtn = document.getElementById('copyQuoteBtn');
  const aliasModalOverlay = document.getElementById('aliasModalOverlay');
  const aliasModalInput = document.getElementById('aliasModalInput');
  const aliasModalSave = document.getElementById('aliasModalSave');
  const aliasModalCancel = document.getElementById('aliasModalCancel');

  function activeTab(){ return tabs[activeTabIndex]; }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 2200);
  }

  function askConfirm(message, confirmLabel, cancelLabel){
    return new Promise((resolve) => {
      modalMessageEl.textContent = message || 'هل أنت متأكد؟';
      modalConfirm.textContent = confirmLabel || 'نعم، تأكيد';
      modalCancel.textContent = cancelLabel || 'لا، تراجع';
      modalOverlay.classList.add('show');
      const cleanup = (result) => {
        modalOverlay.classList.remove('show');
        modalConfirm.removeEventListener('click', onConfirm);
        modalCancel.removeEventListener('click', onCancel);
        modalOverlay.removeEventListener('click', onOverlay);
        document.removeEventListener('keydown', onKey);
        resolve(result);
      };
      const onConfirm = () => cleanup(true);
      const onCancel = () => cleanup(false);
      const onOverlay = (e) => { if(e.target === modalOverlay) cleanup(false); };
      const onKey = (e) => { if(e.key === 'Escape') cleanup(false); };
      modalConfirm.addEventListener('click', onConfirm);
      modalCancel.addEventListener('click', onCancel);
      modalOverlay.addEventListener('click', onOverlay);
      document.addEventListener('keydown', onKey);
    });
  }

  function toArabicDigits(num){
    const map = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
    return String(num).split('').map(d => map[+d] ?? d).join('');
  }
  function fromArabicDigits(str){
    const map = {'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
    return String(str).split('').map(c => map[c] ?? c).join('');
  }
  function genCode(){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let out = '';
    for(let i=0;i<6;i++) out += chars[Math.floor(Math.random()*chars.length)];
    return out;
  }
  function genId(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
  }

  // =========================================================
  // DATA LAYER — نفس الواجهة، تنفيذين مختلفين
  // =========================================================
  const localData = {
    async ensureMine(){
      let code = localStorage.getItem('kenzy-my-code');
      let quotes = null;
      const raw = localStorage.getItem('kenzy-my-quotes');
      if(raw){ try{ quotes = JSON.parse(raw); }catch(e){ quotes = null; } }
      if(!code || !Array.isArray(quotes)){
        code = code || genCode();
        quotes = DEFAULT_QUOTES.map(t => ({id: genId(), text: t}));
        localStorage.setItem('kenzy-my-code', code);
        localStorage.setItem('kenzy-my-quotes', JSON.stringify(quotes));
      }
      return {code, collectionId:null, quotes, username:null, usernameUpdatedAt:null};
    },
    async openByCode(){ return null; }, // مش متاحة غير لما نتربط بقاعدة بيانات حقيقية
    async addQuote(tab, text){
      const q = {id: genId(), text};
      tab.quotes.push(q);
      localStorage.setItem('kenzy-my-quotes', JSON.stringify(tab.quotes));
      return q;
    },
    async deleteQuote(tab, quoteId){
      tab.quotes = tab.quotes.filter(q => q.id !== quoteId);
      localStorage.setItem('kenzy-my-quotes', JSON.stringify(tab.quotes));
    }
  };

  const remoteData = {
    async fetchQuotes(collectionId){
      const {data, error} = await sb.from('quotes').select('id, text').eq('collection_id', collectionId).order('created_at', {ascending:true});
      if(error) throw error;
      return (data||[]).map(q => ({id:q.id, text:q.text}));
    },
    async ensureMine(){
      let code = localStorage.getItem('kenzy-my-code');
      if(code){
        const {data} = await sb.from('collections').select('id, code, owner_name, username_updated_at').eq('code', code).maybeSingle();
        if(data){
          const quotes = await this.fetchQuotes(data.id);
          return {code:data.code, collectionId:data.id, quotes, username:data.owner_name, usernameUpdatedAt:data.username_updated_at};
        }
      }
      const newCode = genCode();
      const {data: col, error} = await sb.from('collections').insert({code:newCode}).select().single();
      if(error) throw error;
      const rows = DEFAULT_QUOTES.map(t => ({collection_id: col.id, text:t}));
      const {data: seeded, error: seedErr} = await sb.from('quotes').insert(rows).select();
      if(seedErr) throw seedErr;
      localStorage.setItem('kenzy-my-code', col.code);
      return {code: col.code, collectionId: col.id, quotes:(seeded||[]).map(q=>({id:q.id, text:q.text})), username:null, usernameUpdatedAt:null};
    },
    async openByCode(code){
      const {data, error} = await sb.from('collections').select('id, code, owner_name').eq('code', code).maybeSingle();
      if(error || !data) return null;
      const blocked = await isBlockedBy(data.id);
      const quotes = blocked ? [] : await this.fetchQuotes(data.id);
      return {code:data.code, collectionId:data.id, label:data.owner_name || data.code, quotes, blocked};
    },
    async addQuote(tab, text){
      const {data, error} = await sb.from('quotes').insert({collection_id: tab.collectionId, text}).select().single();
      if(error) throw error;
      const q = {id:data.id, text:data.text};
      tab.quotes.push(q);
      return q;
    },
    async deleteQuote(tab, quoteId){
      const {error} = await sb.from('quotes').delete().eq('id', quoteId);
      if(error) throw error;
      tab.quotes = tab.quotes.filter(q => q.id !== quoteId);
    }
  };

  const store = sb ? remoteData : localData;

  // =========================================================
  // TABS
  // =========================================================
  function renderTabs(){
    tabsRow.querySelectorAll('.tab-item').forEach(el => el.remove());
    tabs.forEach((t, i) => {
      const item = document.createElement('div');
      item.className = 'tab-item' + (i === activeTabIndex ? ' active' : '');

      const label = document.createElement('span');
      label.className = 'tab-label';
      label.textContent = i === 0 ? 'أقوالي' : (t.customLabel || t.defaultLabel || t.code);
      item.appendChild(label);

      if(i !== 0){
        const aliasBtn = document.createElement('button');
        aliasBtn.className = 'tab-alias';
        aliasBtn.title = 'اسم مستعار';
        aliasBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
        aliasBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          openAliasModal(i);
        });
        item.appendChild(aliasBtn);

        const closeBtn = document.createElement('button');
        closeBtn.className = 'tab-close';
        closeBtn.textContent = '×';

  async function closeTab(i){
    if(i === 0) return; // ماينفعش تقفلي تاب "أقوالي"
    const ok = await askConfirm('هل تريد إغلاق هذا التاب؟', 'نعم، أغلق', 'لا، تراجع');
    if(!ok) return;
    const tab = tabs[i];
    const wasActive = (i === activeTabIndex);
    tabs.splice(i, 1);
    if(wasActive){ activeTabIndex = 0; currentIndex = 0; }
    else if(activeTabIndex > i){ activeTabIndex -= 1; }
    persistSharedCodesList();
    renderTabs();
    updateEditableUI();
    render(false);
    sendNotification(tab.collectionId, 'left');
    unregisterWatcher(tab.collectionId);
  }

  function updateCodeBar(){
    codeValueEl.textContent = tabs[0] ? tabs[0].code : '......';
  }

  function updateEditableUI(){
    const editable = activeTab().editable;
    addSection.style.display = editable ? '' : 'none';
  }

  async function switchTab(i){
    activeTabIndex = i;
    currentIndex = 0;
    renderTabs();
    updateEditableUI();
    const tab = tabs[i];
    if(!tab.editable && sb){
      try{
        const blocked = await isBlockedBy(tab.collectionId);
        tab.blocked = blocked;
        tab.quotes = blocked ? [] : await remoteData.fetchQuotes(tab.collectionId);
      }catch(e){ /* لو فشل التحديث، هنعرض آخر نسخة كانت متاحة */ }
    }
    render(false);
  }

  async function persistSharedCodesList(){
    const items = tabs.slice(1).map(t => ({
      code: t.code,
      customLabel: t.customLabel || null
    }));
    try{ localStorage.setItem('kenzy-shared-codes', JSON.stringify(items)); }catch(e){}
  }

  async function isBlockedBy(ownerCollectionId){
    if(!sb || !tabs[0] || !tabs[0].collectionId || !ownerCollectionId) return false;
    try{
      const {data, error} = await sb.from('watchers').select('blocked').eq('owner_collection_id', ownerCollectionId).eq('watcher_collection_id', tabs[0].collectionId).maybeSingle();

  const ACTION_TEXT = {
    visit: 'دخل على أقاويلك',
    left: 'شال التاب بتاع أقوالك من عنده',
    quote_added: 'أضاف مقولة جديدة',

  function getAliasForCode(code){
    if(!code) return null;
    const t = tabs.find((tab, i) => i > 0 && tab.code === code);

  async function sendNotification(recipientCollectionId, actionKey){

    try{

        collection_id: recipientCollectionId,
        sender_code: tabs[0].code,

  function renderNotifications(list){
    notifBadge.style.display = list.length ? 'flex' : 'none';
    notifBadge.textContent = toArabicDigits(list.length);
    notifClearAllBtn.style.display = list.length ? 'inline-block' : 'none';
    if(list.length === 0){
      notifList.innerHTML = '<p class="panel-empty">لا يوجد إشعارات جديدة</p>';
      return;
    }

    // نجهّز كل إشعار: نحسب اسمه (مستعار لو موجود) ونص الحدث
    const composed = list.map(n => {
      if(n.action_key && ACTION_TEXT[n.action_key]){
        const alias = getAliasForCode(n.sender_code);
        const name = alias || n.sender_username_snapshot || n.sender_code || 'زائر';
        return {id:n.id, name, code:n.sender_code || '', actionText: ACTION_TEXT[n.action_key], legacy:null};
      }
      return {id:n.id, name:null, code:'', actionText:null, legacy:n.message || ''};
    });

    // لو في اسمين زي بعض، نضيف الكود جنب كل واحد فيهم للتفرقة
    const nameCounts = {};
    composed.forEach(c => { if(c.name) nameCounts[c.name] = (nameCounts[c.name] || 0) + 1; });
    composed.forEach(c => {
      if(c.name){
        const shownName = (nameCounts[c.name] > 1 && c.code) ? (c.name + ' (' + c.code + ')') : c.name;
        c.finalText = shownName + ' ' + c.actionText;
      } else {
        c.finalText = c.legacy;
      }
    });

    // تجميع الإشعارات المتكررة (نفس الشخص ونفس الحدث) في سطر واحد بعلامة ×العدد
    const groups = [];
    const groupIndex = new Map();
    composed.forEach(c => {
      const key = c.name ? (c.code + '|' + c.actionText) : ('legacy|' + c.legacy);
      if(!groupIndex.has(key)){
        groupIndex.set(key, groups.length);
        groups.push({ids:[c.id], text:c.finalText, count:1});
      } else {
        const g = groups[groupIndex.get(key)];
        g.ids.push(c.id);
        g.count += 1;
      }
    });

    notifList.innerHTML = '';
    groups.forEach(g => {
      const item = document.createElement('div');
      item.className = 'notif-item';
      const span = document.createElement('span');
      span.textContent = g.count > 1 ? (g.text + ' ×' + toArabicDigits(g.count)) : g.text;
      const closeBtn = document.createElement('button');
      closeBtn.className = 'notif-close';
      closeBtn.textContent = '×';
      closeBtn.title = 'حذف الإشعار';
      closeBtn.addEventListener('click', async () => {
        const ok = await askConfirm('هل تريد حذف هذا الإشعار؟', 'نعم، احذف', 'لا، تراجع');
        if(!ok) return;
        try{
          await sb.from('notifications').delete().in('id', g.ids);
          loadNotifications();
          refreshNotifBadgeCount();
        }catch(e){ showToast('تعذّر الحذف'); }
      });
      item.appendChild(span);
      item.appendChild(closeBtn);
      notifList.appendChild(item);
    });
  }

  function renderViewers(rows, colMap){
    // نحسب اسم كل شخص: الاسم المستعار (لو موجود) وإلا اسم المستخدم بتاعه وإلا الكود
    const entries = rows.map(r => {
      const col = colMap[r.watcher_collection_id];
      const code = col ? col.code : '';
      const alias = getAliasForCode(code);
      const baseName = alias || (col ? (col.owner_name || col.code) : 'مستخدم');
      return {row:r, code, baseName};
    });

    // لو في اسمين زي بعض، نضيف الكود جنب كل واحد فيهم للتفرقة
    const nameCounts = {};
    entries.forEach(e => { nameCounts[e.baseName] = (nameCounts[e.baseName] || 0) + 1; });

    viewersList.innerHTML = '';
    entries.forEach(({row:r, code, baseName}) => {
      const shownName = (nameCounts[baseName] > 1 && code) ? (baseName + ' (' + code + ')') : baseName;
      const item = document.createElement('div');
      item.className = 'viewer-item' + (r.blocked ? ' blocked' : '');
      const span = document.createElement('span');
      span.textContent = shownName + (r.blocked ? ' (محجوب)' : '');
      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'viewer-toggle' + (r.blocked ? ' is-blocked' : '');
      toggleBtn.textContent = r.blocked ? 'إلغاء الحجب' : 'حجب';
      toggleBtn.addEventListener('click', async () => {
        const newBlocked = !r.blocked;
        const msg = newBlocked ? 'هل تريد حجب هذا الشخص عن مشاهدة أقوالك؟' : 'هل تريد إلغاء الحجب عن هذا الشخص؟';
        const ok = await askConfirm(msg, newBlocked ? 'نعم، احجب' : 'نعم، ألغِ الحجب', 'لا، تراجع');
        if(!ok) return;
        try{
          await sb.from('watchers').update({blocked:newBlocked}).eq('id', r.id);
          showToast(newBlocked ? 'اتحجب' : 'اتشال الحجب');
          loadViewers();
        }catch(e){ showToast('تعذّر التحديث'); }
      });
      item.appendChild(span);
      item.appendChild(toggleBtn);
      viewersList.appendChild(item);
    });
  }

  async function loadViewers(){
    if(!sb || !tabs[0] || !tabs[0].collectionId){
      viewersList.innerHTML = '<p class="panel-empty">الميزة دي هتشتغل لما الموقع يترابط بقاعدة البيانات</p>';
      return;
    }
    try{
      const {data: rows, error} = await sb.from('watchers').select('id, watcher_collection_id, blocked').eq('owner_collection_id', tabs[0].collectionId).order('created_at', {ascending:false});
      if(error) throw error;
      if(!rows || rows.length === 0){
        viewersList.innerHTML = '<p class="panel-empty">محدش فاتح أقوالك لسه</p>';
        return;
      }
      const ids = rows.map(r => r.watcher_collection_id);
      const {data: cols, error: colErr} = await sb.from('collections').select('id, code, owner_name').in('id', ids);
      if(colErr) throw colErr;
      const colMap = {};

  function usernameCooldownDaysLeft(){
    if(!myUsernameUpdatedAt) return 0;
    const diffDays = (Date.now() - new Date(myUsernameUpdatedAt).getTime()) / (1000*60*60*24);
    return diffDays >= 7 ? 0 : Math.ceil(7 - diffDays);
  }

  function updateUsernameHint(){
    if(!sb){
      usernameHint.textContent = 'الميزة دي هتشتغل لما الموقع يترابط بقاعدة البيانات';
      usernameSaveBtn.disabled = true;
      return;
    }
    usernameSaveBtn.disabled = false;
    const daysLeft = usernameCooldownDaysLeft();
    if(daysLeft > 0){
      usernameHint.textContent = 'تقدر تغيّر اسمك تاني بعد ' + toArabicDigits(daysLeft) + ' يوم';
    } else {
      usernameHint.textContent = 'الاسم ده هيظهر للي بيدخلوا يشوفوا أقوالك بالكود';
    }
  }

      usernamePanel.classList.add('open');

      usernameInput.value = myUsername || '';

      setTimeout(()=> usernameInput.focus(), 200);

  usernameSaveBtn.addEventListener('click', async () => {

  });
  codeEntryCancel.addEventListener('click', () => {

  codeEntryInput.addEventListener('keydown', (e) => {

  codeEntrySubmit.addEventListener('click', async () => {

  async function copyToClipboard(text){
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(text);
        return true;
      }
    }catch(e){ /* falls through to the legacy method below */ }
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }catch(e){
      return false;
    }
  }

  copyCodeBtn.addEventListener('click', async () => {
    const code = tabs[0] ? tabs[0].code : '';
    if(!code) return;
    const ok = await copyToClipboard(code);
    showToast(ok ? 'اتنسخ الكود' : ('كودك: ' + code));
  });

  // =========================================================
  // RENDER

  function renderDots(){
    dotsEl.innerHTML = '';
    const list = activeTab().quotes;
    const max = 24;
    const show = Math.min(list.length, max);
    for(let i=0;i<show;i++){
      const d = document.createElement('div');
      d.className = 'dot' + (i === currentIndex ? ' active' : '');
      d.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(d);
    }
  }

  function render(animate){
    const tab = activeTab();
    const list = tab.quotes;
    const hasQuotes = list.length > 0;
    const text = tab.blocked
      ? 'صاحب الأقوال ده حجبك عن مشاهدتها 🚫'
      : (hasQuotes ? list[currentIndex].text : 'لا توجد مقولات هنا بعد');

    const doRender = () => {
      quoteText.classList.remove('loading-state');
      quoteText.textContent = text;
      quoteIndexInput.value = (hasQuotes && !tab.blocked) ? toArabicDigits(currentIndex+1) : '';
      quoteTotal.textContent = (hasQuotes && !tab.blocked) ? ('/ ' + toArabicDigits(list.length)) : '';
      deleteBtn.style.display = (tab.editable && hasQuotes) ? 'inline-block' : 'none';
      copyQuoteBtn.style.display = (hasQuotes && !tab.blocked) ? 'inline-flex' : 'none';
      requestAnimationFrame(()=> quoteText.classList.remove('dissolve'));
      renderDots();
    };

    if(animate){
      quoteText.classList.add('dissolve');
      setTimeout(doRender, 260);
    } else {
      doRender();
    }
  }

  function goTo(i){
    const list = activeTab().quotes;
    if(list.length === 0) return;
    currentIndex = ((i % list.length) + list.length) % list.length;
    render(true);
  }

  nextBtn.addEventListener('click', () => goTo(currentIndex + 1));
  prevBtn.addEventListener('click', () => goTo(currentIndex - 1));

  document.addEventListener('keydown', (e) => {
    if(document.activeElement === quoteIndexInput) return;
    if(document.activeElement === codeEntryInput) return;
    if(e.key === 'ArrowLeft') goTo(currentIndex - 1);
    if(e.key === 'ArrowRight') goTo(currentIndex + 1);
  });

  function commitIndexInput(){
    const list = activeTab().quotes;
    const raw = fromArabicDigits(quoteIndexInput.value.trim());
    const n = parseInt(raw, 10);
    if(!isNaN(n) && n >= 1 && n <= list.length){
      goTo(n - 1);
    } else if(list.length){
      quoteIndexInput.value = toArabicDigits(currentIndex + 1);
    }
  }
  quoteIndexInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); quoteIndexInput.blur(); }
  });
  quoteIndexInput.addEventListener('blur', commitIndexInput);
  quoteIndexInput.addEventListener('click', () => quoteIndexInput.select());

  // =========================================================
  // ADD / DELETE
  // =========================================================
  addToggle.addEventListener('click', () => {
    const open = addForm.classList.toggle('open');

  });

  submitBtn.addEventListener('click', async () => {

      await store.addQuote(tab, val);

    }catch(err){
      showToast('تعذّر الحفظ، حاول تاني');
    }finally{
      submitBtn.disabled = false;
    }
  });

  deleteBtn.addEventListener('click', async () => {
    const tab = activeTab();
    if(!tab.editable || tab.quotes.length === 0) return;
    const ok = await askConfirm('هل تريد حذف هذه المقولة؟', 'نعم، احذف', 'لا، تراجع');
    if(!ok) return;
    const q = tab.quotes[currentIndex];
    try{
      await store.deleteQuote(tab, q.id);
    }catch(err){
      showToast('تعذّر الحذف'); return;
    }
    notifyWatchers('quote_deleted');
    if(tab.quotes.length === 0){
      render(false);
      return;
    }
    goTo(Math.min(currentIndex, tab.quotes.length - 1));
    showToast('حُذفت المقولة');
  });

  copyQuoteBtn.addEventListener('click', async () => {
    const list = activeTab().quotes;
    if(!list.length) return;
    const ok = await copyToClipboard(list[currentIndex].text);
    showToast(ok ? 'اتنسخت المقولة' : 'تعذّر النسخ');
  });

  // =========================================================
  // INIT
  // =========================================================
  async function init(){
    try{
      const mine = await store.ensureMine();
      tabs = [{code:mine.code, collectionId:mine.collectionId, defaultLabel:'أقوالي', customLabel:null, quotes:mine.quotes, editable:true}];
      myUsername = mine.username || null;
      myUsernameUpdatedAt = mine.usernameUpdatedAt || null;
    }catch(err){
      console.error(err);
      tabs = [{code:'------', collectionId:null, defaultLabel:'أقوالي', customLabel:null, quotes:DEFAULT_QUOTES.map(t=>({id:genId(), text:t})), editable:true}];
      showToast('تعذّر الاتصال بقاعدة البيانات، الوضع محلي مؤقتًا');
    }

    if(sb){
      let savedItems = [];
      try{ savedItems = JSON.parse(localStorage.getItem('kenzy-shared-codes') || '[]'); }catch(e){}
      for(const item of savedItems){
        const code = (typeof item === 'string') ? item : item.code;
        const customLabel = (typeof item === 'object' && item) ? item.customLabel : null;
        try{
          const result = await remoteData.openByCode(code);
          if(result){
            tabs.push({code:result.code, collectionId:result.collectionId, defaultLabel:result.label, customLabel:customLabel || null, quotes:result.quotes, editable:false, blocked:!!result.blocked});
            registerWatcher(result.collectionId);
          }
        }catch(e){ /* تخطي الكود اللي فشل تحميله */ }
      }
    }

    activeTabIndex = 0;
    currentIndex = 0;
    renderTabs();
    updateCodeBar();
    updateEditableUI();
    render(false);
    refreshNotifBadgeCount();
  }

  init();
})();
</script>
